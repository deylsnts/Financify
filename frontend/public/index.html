<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Viewport for proper mobile scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Theme color for browser UI -->
    <meta name="theme-color" content="#020617" />

    <!-- SEO description -->
    <meta
      name="description"
      content="Financify – A simple and modern personal finance tracker to manage your income and expenses."
    />

    <!-- App Title -->
    <title>Financify</title>

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/financify-icon.png" />

    <!-- Apple iOS icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/financify-icon.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Better mobile UI -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Prevent automatic phone/email detection -->
    <meta name="format-detection" content="telephone=no,email=no,address=no" />

    <!-- Google Font for modern UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  </head>

  <body>
    <noscript>You need to enable JavaScript to run Financify.</noscript>

    <!-- React root -->
    <div id="root"></div>
  </body>
</html>
